name: Cleanup World Engine
on:
  push:
    branches: [main]
    paths:
      - cleanup_world_engine.py
      - .github/workflows/cleanup-world-engine.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run cleanup
        run: python cleanup_world_engine.py
      - name: Commit cleaned engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Clean narrative engine: realism, pacing, NPC autonomy, knowledge boundaries"
            git push
          fi
