name: Clean Aerfala World Engine
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clean-aerfala-engine.yml"
      - ".github/scripts/clean_aerfala_engine.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch world engine
        run: python .github/scripts/clean_aerfala_engine.py
      - name: Commit cleaned engine
        run: |
          if git diff --quiet -- "World Engine"; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "ChatGPT World Engine Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add "World Engine"
          git commit -m "Clean narrative engine for persistent realistic Aerfala play"
          git push
